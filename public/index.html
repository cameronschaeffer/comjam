<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0a16" />
  <title>ComJam · Community Jam Queue</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="home">
    <div class="hero">
      <span class="mark">🎸</span>
      <h1>Com<span class="grad-text">Jam</span></h1>
      <p>Request songs. Vote together. Sing all night.</p>
    </div>

    <div class="card home-card">
      <div class="tabs">
        <button id="tab-join" class="active">Join a jam</button>
        <button id="tab-create">Start a jam</button>
      </div>

      <form id="join-form" class="form-stack">
        <input id="join-code" class="field code-input" placeholder="CODE" maxlength="4"
               autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <button class="btn btn-primary" type="submit">Join the jam 🎤</button>
      </form>

      <form id="create-form" class="form-stack hidden">
        <input id="create-name" class="field" placeholder="Jam name (e.g. Friday Night Jam)" maxlength="60" />
        <input id="host-name" class="field" placeholder="Your name (optional)" maxlength="40" />
        <button class="btn btn-primary" type="submit">Start the jam 🚀</button>
      </form>
    </div>
  </main>

  <div id="toasts"></div>
  <script src="/js/shared.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
